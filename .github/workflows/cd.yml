name: Continuous Deployment (CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Server & Client Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install & verify Server
        working-directory: ./server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/career_lens_test?schema=public
          JWT_SECRET: test-jwt-secret-key-minimum-32-characters-long
          AI_PROVIDER: groq
          AI_API_KEY: test-ai-key
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
          npm test
          npm run build

      - name: Install & verify Client
        working-directory: ./client
        env:
          VITE_API_BASE_URL: https://truehire-api.onrender.com/api
        run: |
          npm ci
          npm test -- --run
          npm run build

  deploy-backend:
    name: Deploy Backend to Render
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set; skipping webhook trigger (Render auto-deploy on main may handle this)."
            exit 0
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"

  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret is not set; skipping webhook trigger (Vercel Git integration may handle this)."
            exit 0
          fi
          curl -fsSL -X POST "$VERCEL_DEPLOY_HOOK_URL"