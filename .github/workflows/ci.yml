name: TrueHire CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  server-verify:
    name: Backend Typecheck & Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truehire_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/truehire_test
      JWT_SECRET: ci-test-secret-key-minimum-32-chars-long-2026
      CLIENT_URL: http://localhost:5173
      AI_PROVIDER: groq
      GROQ_API_KEY: ci-mock-key
      AI_API_KEY: ci-mock-key
      NVIDIA_API_KEY: ci-mock-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test

  client-verify:
    name: Frontend Typecheck, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    env:
      VITE_API_BASE_URL: http://localhost:5000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test --if-present
      - run: npm run build
