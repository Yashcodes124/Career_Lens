services:
  - type: web
    name: truehire-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AI_PROVIDER
        value: groq
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: qwen/qwen3.8-27b
      - key: NVIDIA_MODEL
        value: meta/llama-3.1-70b-instruct
      - key: AI_TIMEOUT_MS
        value: 60000
      - key: GREENHOUSE_BOARDS
        value: stripe,razorpay,swiggy,zomato,zerodha,cloudflare,vercel
      - key: GREENHOUSE_BOARD_TOKEN
        value: stripe
      - key: GREENHOUSE_COMPANY
        value: stripe
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false