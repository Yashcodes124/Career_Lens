services:
  postgres:
    image: postgres:16-alpine
    container_name: truehire-postgres
    restart: always
    environment:
      POSTGRES_USER: careerlens_user
      POSTGRES_PASSWORD: careerlens_password
      POSTGRES_DB: careerlens_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerlens_user -d careerlens_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
